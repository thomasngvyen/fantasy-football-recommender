server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location /players {
        proxy_pass http://backend:8000;
    }

    location /compare {
        proxy_pass http://backend:8000;
    }

    location /schedule {
        proxy_pass http://backend:8000;
    }
}
